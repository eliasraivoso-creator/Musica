name: "Build & Release"

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-24.04
    env:
      GRADLE_OPTS: -Dorg.gradle.caching=true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Select Build JDK
        run: flutter config --jdk-dir="$JAVA_HOME"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> ../build/rust_lib_Bloomee/build
          key: android-flutter-${{ env.FLUTTER_VERSION }}-${{ hashFiles('android/settings.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties', 'rust_builder/cargokit/**') }}
          cache-workspace-crates: true

      - name: Install Dependencies
        run: flutter pub get --enforce-lockfile

      - name: Create Test Signing Key
        run: |
          keytool -genkeypair -keystore android/bloomee.jks \
            -storetype PKCS12 -alias bloomee -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass bloomee123 -keypass bloomee123 \
            -dname "CN=Bloomee Custom, O=Custom, C=BR"
          printf 'keyPassword=bloomee123\nstorePassword=bloomee123\nkeyAlias=bloomee\n' > android/key.properties

      - name: Build Android APK
        run: flutter build apk --release --target-platform android-arm64 --build-number "$GITHUB_RUN_NUMBER"

      - name: Stage APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/bloomee_custom_arm64.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Bloomee-APK
          path: dist/bloomee_custom_arm64.apk
          if-no-files-found: error
          compression-level: 0
          overwrite: true
